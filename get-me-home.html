<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyTechgacity tabs — design preview</title>
    <!-- Public, for the stakeholder, but not something to find by search. -->
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <!-- A second page, beside index.html rather than a route inside it, for
         two reasons.

         It does not load src/styles.css. That stylesheet styles bare label,
         input, select and button elements, and MUI draws with exactly those
         -- so inside the load board the planner would look like neither app.
         Out here it looks the way it will on the host.

         It IS built and deployed, since 2026-10-02, so a stakeholder can
         see the tabs: vite.config.js lists it as a second entry. Deployed,
         it shows the sample data only -- made-up drivers, nothing saved.
         The laptop database and live data are options on `npm run dev`
         alone (http://localhost:5173/get-me-home.html). -->
    <div id="root"></div>
    <script type="module" src="/src/features/preview/main.tsx"></script>
  </body>
</html>
